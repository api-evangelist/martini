aid: martini
name: Martini
description: >-
  Martini is a collaborative, AI-native filmmaking platform — "Figma for filmmaking" —
  that lets teams generate, direct, and edit AI video in real time and export to
  professional editing software (Adobe Premiere Pro, DaVinci Resolve) via XML. Filmmakers
  compose shots with virtual camera control, keep characters consistent across shots using
  reusable Subjects, and generate footage across leading models (Google Veo 3.1, Kling 3.0
  Pro, OpenAI Sora 2, MiniMax Hailuo 02, ByteDance Seedance, Nano Banana Pro, Flux 2). Its
  developer surface is a hosted, OAuth-secured Model Context Protocol (MCP) connector at
  https://www.martini.film/mcp that lets AI assistants (Claude Desktop/Code, Gemini CLI,
  ChatGPT, Cursor) browse projects, organize canvases and subjects, upload references, and
  run approved generation inside a user's own account. Martini also publishes open Agent
  Skills on GitHub, including a Blender-to-Martini camera-faithful handoff. Built by C47
  Inc.; Y Combinator Winter 2026.
